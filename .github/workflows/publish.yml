name: Publish

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Publish package to npm
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
